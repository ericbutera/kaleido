name: Publish Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: typescript/packages/kaleido

      - name: Typecheck
        run: pnpm typecheck
        working-directory: typescript/packages/kaleido

      - name: Build
        run: pnpm build
        working-directory: typescript/packages/kaleido

      # npm trusted publishing supports GitHub Actions, GitLab.com shared
      # runners, and CircleCI cloud, but not Woodpecker. Keep npm publishing
      # here until npm supports Woodpecker OIDC or we choose token publishing.
      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        working-directory: typescript/packages/kaleido

  publish-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check crates.io version
        id: crate
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kaleido/Cargo.toml | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if cargo info --registry crates-io "kaleido@$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "crates.io already has kaleido@$version; skipping Rust publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: rust

      # crates.io trusted publishing supports GitHub Actions and GitLab.com
      # shared runners, but not Woodpecker. Keep registry publishing here so
      # releases do not need a long-lived crates.io token in Woodpecker.
      - name: Authenticate with crates.io
        if: steps.crate.outputs.exists != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.crate.outputs.exists != 'true'
        run: cargo publish -p kaleido --locked
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
