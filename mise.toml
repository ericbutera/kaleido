[tools]
node = "25.2.1"
pnpm = "10.30.1"
prek = "0.4.12"
rust = "1.97.1"
"npm:prettier" = "3.7.4"

[settings]
disable_tools = [
  "act",
  "copier",
  "dotnet",
  "go",
  "helm",
  "k9s",
  "kubectl",
  "pulumi",
  "python",
  "ripgrep",
  "task",
  "tilt",
  "woodpecker-cli",
]

[tasks."hooks:install"]
description = "Install prek Git hooks for this repository"
run = "prek install -f"

[tasks."format:staged"]
description = "Run prek on staged files"
run = "prek run"

[tasks.build]
description = "Build the Kaleido TypeScript package"
dir = "typescript/packages/kaleido"
run = "pnpm build"

[tasks.typecheck]
description = "Typecheck the Kaleido TypeScript package"
dir = "typescript/packages/kaleido"
run = "pnpm typecheck"

[tasks.version]
description = "Print the current Kaleido TypeScript package version"
dir = "typescript/packages/kaleido"
run = "node -p \"require('./package.json').version\""

[tasks."release:status"]
description = "Show current release state"
run = "bash scripts/release.sh status"

[tasks.release]
description = "Create and push a guarded Kaleido patch release"
run = "bash scripts/release.sh patch"

[tasks."release:patch"]
description = "Create and push a guarded Kaleido patch release"
run = "bash scripts/release.sh patch"

[tasks."release:minor"]
description = "Create and push a guarded Kaleido minor release"
run = "bash scripts/release.sh minor"

[tasks."release:major"]
description = "Create and push a guarded Kaleido major release"
run = "bash scripts/release.sh major"

[tasks."publish:patch"]
description = "Alias for release:patch"
run = "mise run release"

[tasks."publish:minor"]
description = "Alias for release:minor"
run = "mise run release:minor"

[tasks."publish:major"]
description = "Alias for release:major"
run = "mise run release:major"
