[tools]
cargo-binstall = "latest"
node = "25.2.1"
pnpm = "10.30.1"
rust = "1.97.1"

[tasks."ui-next:deps"]
description = "Install UI dependencies"
dir = "ui-next"
run = "pnpm install"

[tasks."ui-next:dev"]
description = "Run the Next.js dev server"
depends = ["ui-next:deps"]
dir = "ui-next"
run = "pnpm run dev"

[tasks."api:dev"]
description = "Run the API server"
run = "cargo run --bin api"

[tasks."api:build"]
description = "Build the API binary"
run = "cargo build --release --bin api"

[tasks."worker:dev"]
description = "Run the worker"
run = "cargo run --bin worker"

[tasks."migration:up"]
description = "Run database migrations"
dir = "migration"
run = "cargo run -- up"

[tasks.test]
description = "Run Rust tests"
run = "cargo test"

[tasks."openapi:react-query"]
description = "Generate OpenAPI TypeScript definitions from running API"
run = '''
echo "Waiting for API to be ready..."
OPENAPI_URL="${OPENAPI_URL:-http://localhost:3000/openapi.json}"
for i in {1..30}; do
  status=$(curl -s -o /tmp/openapi.json -w "%{http_code}" "$OPENAPI_URL" || echo "000")
  if [ "$status" = "200" ]; then
    if node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8')); if(!j.openapi) process.exit(2);" >/dev/null 2>&1; then
      break
    fi
  fi
  sleep 2
done
npx openapi-typescript /tmp/openapi.json --output ui-next/lib/openapi/react-query/api.d.ts
rm -f /tmp/openapi.json
'''
