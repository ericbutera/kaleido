minimum_prek_version = "0.4.0"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prettier"
name = "Prettier"
language = "system"
entry = "mise exec -- prettier --write --ignore-unknown"
files = "\\.(css|js|jsx|json|jsonc|md|mdx|ts|tsx|yaml|yml)$"
exclude = "^(node_modules|typescript/packages/kaleido/(dist|node_modules)|typescript/packages/kaleido/scaffold/copier-template/ui-next/(\\.next|dist|node_modules))/"
